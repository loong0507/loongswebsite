<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="云端头像">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#8ed9f2"/>
      <stop offset="1" stop-color="#d5f3fb"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3b0" stop-opacity=".95"/>
      <stop offset="1" stop-color="#fff3b0" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round">
      <circle cx="100" cy="100" r="100"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="200" height="200" fill="url(#sky)"/>
    <circle cx="160" cy="40" r="56" fill="url(#sun)"/>

    <g fill="#ffffff" opacity=".92">
      <ellipse cx="52" cy="62" rx="32" ry="12"/>
      <ellipse cx="72" cy="53" rx="20" ry="13"/>
      <ellipse cx="150" cy="106" rx="26" ry="9" opacity=".7"/>
    </g>

    <path d="M-12 162c32-26 68-30 102-18 30 11 62 8 122-14v82H-12Z" fill="#8fdfd1" opacity=".8"/>
    <path d="M-12 178c40-18 72-20 106-10 32 9 58 6 118-12v56H-12Z" fill="#5cbfb0" opacity=".55"/>

    <text x="100" y="124" text-anchor="middle"
          font-family="Songti SC, STSong, SimSun, serif"
          font-size="62" fill="#0f3a47" opacity=".88">云</text>
  </g>

  <circle cx="100" cy="100" r="98" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity=".9"/>
</svg>
